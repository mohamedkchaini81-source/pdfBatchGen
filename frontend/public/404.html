<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PDF Batch Gen</title>
  <script>
    // GitHub Pages SPA redirect:
    // Converts the 404 path back into a query string that index.html
    // can pick up and restore the original URL.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
