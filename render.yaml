services:
  - type: web
    name: pdf-batch-gen-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://mohamedkchaini81-source.github.io","http://localhost:5173"]'
