services:
  - type: web
    name: pdf-batch-gen-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEBUG
        value: false
      - key: CORS_ORIGINS
        value: '["https://mohamedkchaini81-source.github.io"]'
      - key: TEMP_DIR
        value: ./temp
      - key: JOB_EXPIRY_SECONDS
        value: 3600
    disk:
      name: temp-storage
      mountPath: /opt/render/project/src/temp
      sizeGB: 1
