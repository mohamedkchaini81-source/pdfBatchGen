services:

  # ── Backend — Python Web Service ───────────────────────────────────────────
  - type: web
    name: pdf-batch-gen-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,https://pdf-batch-gen-frontend.onrender.com
      - key: DEBUG
        value: "false"
      - key: TEMP_DIR
        value: /tmp/pdf_batch_gen
      - key: JOB_EXPIRY_SECONDS
        value: "3600"

  # ── Frontend — Static Site ─────────────────────────────────────────────────
  - type: web
    name: pdf-batch-gen-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://pdf-batch-gen-backend.onrender.com
